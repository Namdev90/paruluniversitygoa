[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compose = "2026.09.00"
material = "1.4.0"
activity = "1.13.0"
lifecycle = "2.11.0"
credentials = "1.6.0"
googleid = "1.2.1"
coroutines = "1.11.0"
camera = "1.6.2"
browser = "1.10.0"
splash = "1.2.0"
junit = "4.13.2"
robolectric = "4.16.1"
adaptive = "1.3.0"
navigation = "2.10.2"
fragment = "1.9.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material = { module = "androidx.compose.material3:material3", version.ref = "material" }
compose-icons = { module = "androidx.compose.material:material-icons-extended" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
credentials-play = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
splash = { module = "androidx.core:core-splashscreen", version.ref = "splash" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "adaptive" }
navigation = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
