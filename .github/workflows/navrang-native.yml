name: Native Compose verification
on:
  pull_request:
    paths: ['native-app/**', 'app/java/**', 'app/res/**', 'app/assets/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'tools/**', '.github/workflows/navrang-native.yml']
  push:
    branches: [codex/native-compose-rebuild]
permissions:
  contents: read
concurrency:
  group: navrang-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          # The hosted Android SDK already accepts the standard SDK license.
          # Do not request the removed legacy tools package or unrelated add-on licenses.
          accept-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: ./gradlew :native-app:assembleDebug :native-app:testDebugUnitTest :native-app:lintDebug
      - name: Detect an unpublished release candidate
        id: candidate
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          candidate = json.loads(Path('release.json').read_text())['versionCode'] > json.loads(Path('updates/latest.json').read_text())['versionCode']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('enabled=' + str(candidate).lower() + '\n')
          PY
      - name: Build and inspect unsigned production candidate
        if: steps.candidate.outputs.enabled == 'true'
        env:
          NAVRANG_CANDIDATE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./gradlew :native-app:assembleRelease :native-app:lintRelease
          python3 tools/verify-unsigned-candidate.py native-app/build/outputs/apk/release/native-app-release-unsigned.apk --build-tools "$ANDROID_HOME/build-tools/36.0.0" --expected-source "$NAVRANG_CANDIDATE_SOURCE" --output .build/unsigned-candidate/receipt.json
      - uses: actions/upload-artifact@v4
        if: steps.candidate.outputs.enabled == 'true'
        with:
          name: navrang-unsigned-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            native-app/build/outputs/apk/release/native-app-release-unsigned.apk
            .build/unsigned-candidate/receipt.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-synthetic-verification
          path: |
            native-app/build/reports/
            native-app/build/test-results/
            native-app/build/synthetic-screenshots/
          retention-days: 7
      # The unsigned preparation artifact is never a public APK update. No signing key,
      # production credentials, backend writes, manifest update or publication occurs here.
