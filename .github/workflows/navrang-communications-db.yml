name: Navrang communications PostgreSQL
on:
  pull_request:
    paths: ['server/**', 'tools/check-communications-db.py', '.github/workflows/navrang-communications-db.yml']
  push:
    branches: [main, feature/navrang-080-communications-design]
    paths: ['server/**', 'tools/check-communications-db.py', '.github/workflows/navrang-communications-db.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: navrang-communications-db-${{ github.ref }}
  cancel-in-progress: false
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: navrang_fixture
          POSTGRES_PASSWORD: SYNTHETIC_NAVRANG_FIXTURE_ONLY_080
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d navrang_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, already used by history workflow
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Service-role fixtures and real concurrent PostgreSQL connections
        env:
          NAVRANG_FIXTURE_PASSWORD: SYNTHETIC_NAVRANG_FIXTURE_ONLY_080
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          os.environ['NAVRANG_TEST_DATABASE_URL'] = (
              'postgresql://postgres:' + os.environ['NAVRANG_FIXTURE_PASSWORD']
              + '@127.0.0.1:5432/navrang_fixture'
          )
          subprocess.run(['python3', 'tools/check-communications-db.py'], check=True)
          PY
      # Disposable local data only. No production credentials, provider sends, signing, or publication.
