name: Verify reviewed signed APK transfer
on:
  push:
    branches: [staging/verified-apk-079-report-layout]
permissions:
  contents: write
jobs:
  verify-transfer:
    if: github.repository == 'Namdev90/paruluniversitygoa'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconstruct, independently verify, and store immutable APK blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, re, subprocess, urllib.request, zipfile
          repo = 'Namdev90/paruluniversitygoa'
          base = 'https://api.github.com/repos/' + repo
          def api(path, payload=None):
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(base + path, data=data, headers=headers, method='GET' if payload is None else 'POST')
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)
          parts = ['6cbb30b3eff0929738b4ddb1d0a20885e6437513', 'cbb8e9913e1e8a96df2d33afd7b494b84d7a38a2']
          data = b''
          for sha in parts:
              item = api('/git/blobs/' + sha)
              assert item['sha'] == sha and item['encoding'] == 'base64'
              chunk = base64.b64decode(item['content'])
              assert hashlib.sha1(b'blob ' + str(len(chunk)).encode() + b'\0' + chunk).hexdigest() == sha
              data += chunk
          assert len(data) == 22630853
          assert hashlib.sha256(data).hexdigest() == 'f52a215fc326d4d824b6868859c9d8b05d8102fd01f6f04747848a94c1cf2729'
          expected = '0db3b1e16ef634778eec9e2f76216c13b0d23b3b'
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == expected
          apk = pathlib.Path(os.environ['RUNNER_TEMP']) / 'Navrang-Gate-0.7.9.apk'
          apk.write_bytes(data)
          sdk = pathlib.Path(os.environ['ANDROID_HOME'])
          tools = sorted((sdk / 'build-tools').glob('*/apksigner'))[-1].parent
          cert = subprocess.check_output([str(tools / 'apksigner'), 'verify', '--verbose', '--print-certs', str(apk)], text=True)
          print(cert)
          fingerprints = re.findall(r'certificate SHA-256 digest:\s*([0-9a-f:]+)', cert, re.I)
          assert len(fingerprints) == 1 and fingerprints[0].replace(':', '').lower() == '0b3c42f8b3aa0b49541be98278c8b4da96bad90616aa78a2a6b5e110fb2117ce'
          assert 'Number of signers: 1' in cert
          badging = subprocess.check_output([str(tools / 'aapt2'), 'dump', 'badging', str(apk)], text=True)
          assert "name='in.navrang.gate' versionCode='17' versionName='0.7.9'" in badging
          assert re.search(r"^(?:minSdkVersion|sdkVersion):'24'$", badging, re.M)
          assert "targetSdkVersion:'37'" in badging
          with zipfile.ZipFile(apk) as archive:
              assert hashlib.sha256(archive.read('assets/art/classic-restore.css')).hexdigest() == 'dfd0e17e5aa8d6363919846c4c74fa474d910e71e1a5d6c828e52593106b006e'
              assert hashlib.sha256(archive.read('assets/art/app-icon.png')).hexdigest() == 'b3c9bec6b50d466c244e5b127b87cace038a16d3a236303f4b141e5ea285de9a'
              assert hashlib.sha256(archive.read('assets/art/navrang-transparent.png')).hexdigest() == 'e2356c668cf4199af0ba48e734ace438df3279ef3d27686e884b6352d239ad3f'
          stored = api('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
          assert stored['sha'] == expected
          print('Verified signed APK blob: ' + expected)
          print('No refs, public manifest, or source files were changed by this job.')
