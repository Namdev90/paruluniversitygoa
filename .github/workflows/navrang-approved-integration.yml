name: One-time approved source integration
on:
  push:
    branches: [feature/navrang-responsive-handoff]
    paths: ['.github/workflows/navrang-approved-integration.yml']
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'Namdev90/paruluniversitygoa' && github.ref == 'refs/heads/feature/navrang-responsive-handoff' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TARGET_BRANCH: feature/navrang-responsive-handoff
      APPROVED_MAIN: 8f145f4916bc2d6eed0a226bca774ae7ffe31bf6
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact source boundary and preserve reviewed installer lifecycle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f .github/approved-responsive.py
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$APPROVED_MAIN"
          git config user.name 'Navrang source verification'
          git config user.email '91046536+Namdev90@users.noreply.github.com'
          git merge --no-edit "$APPROVED_MAIN"
          git merge-base --is-ancestor "$APPROVED_MAIN" HEAD
          python3 .github/approved-responsive.py
      - name: Source checks and isolated native harnesses
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm test
          npm run test:native
          python3 tests/sqlite-check.py
          python3 tests/release-check.py
          git diff --check
      - name: Install bounded synthetic-render dependencies
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.57.0 Pillow==11.3.0
          browser="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser"
          echo "NAVRANG_CHROMIUM=$browser" >> "$GITHUB_ENV"
      - name: Render 104 source-only role and viewport cases
        run: |
          set -euo pipefail
          python3 tests/responsive-browser-check.py --output .build/responsive-review
          python3 tools/prepare-preview-images.py .build/responsive-review docs/screenshots
          python3 tools/package-web.py .build/web-portal
      - name: Verify unchanged release channel and archive inventory
        run: |
          set -euo pipefail
          git diff --exit-code 3fb78ea46451a25033cddcdc4fd625dd89e41492 -- release.json updates downloads tools/release_policy.py
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          inventory=json.loads((root/'docs/history/apk-inventory.json').read_text())
          assert len(inventory['artifacts'])==14
          for record in inventory['artifacts']:
              data=(root/'downloads'/record['filename']).read_bytes()
              assert len(data)==record['size'],record['filename']
              assert hashlib.sha256(data).hexdigest()==record['sha256'],record['filename']
          print('Fourteen original archived APK sizes/hashes are unchanged.')
          PY
      - name: Commit only reviewed source and synthetic documentation
        run: |
          set -euo pipefail
          git rm .github/approved-responsive.py
          git add app/assets/index.html app/assets/report-export.js app/assets/reports.js tools/PrepareBrands.java tools/package-web.py server/schema.sql server/reconcile-missing-registration-v077.sql docs/OPERATIONS.md docs/screenshots
          python3 - <<'PY'
          import subprocess
          allowed={'app/assets/index.html','app/assets/report-export.js','app/assets/reports.js','tools/PrepareBrands.java','tools/package-web.py','server/schema.sql','server/reconcile-missing-registration-v077.sql','docs/OPERATIONS.md','.github/approved-responsive.py','docs/screenshots/login-mobile.webp','docs/screenshots/admin-mobile.webp','docs/screenshots/faculty-desktop.webp'}
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert staged and staged<=allowed,staged-allowed
          PY
          git diff --cached --check
          current="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$current" = "$GITHUB_SHA"
          git commit -m 'Preserve installer lifecycle and finalize tested responsive reporting source [skip ci]'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > .build/responsive-review/final-source-head.txt
      - name: Public source and verification receipt
        if: success()
        run: |
          mkdir -p review-artifacts
          git bundle create review-artifacts/navrang-reviewed-source.bundle --all
          cp .build/responsive-review/results.json .build/responsive-review/final-source-head.txt review-artifacts/
          cp docs/screenshots/*.webp review-artifacts/
          tar -czf review-artifacts/navrang-web-portal.tar.gz -C .build/web-portal .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: navrang-reviewed-source-and-web
          path: review-artifacts/
          retention-days: 3
